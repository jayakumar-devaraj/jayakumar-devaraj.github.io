---
layout: default
---
<section class="page-header">
  <div class="container">
    {%- if page.url contains "/work/" and page.url != "/work/" %}
    <a class="page-kicker" href="{{ "/#work" | relative_url }}">← Case studies</a>
    {%- endif %}
    <h1>{{ page.title | escape }}</h1>
  </div>
</section>

<main class="page-body">
  <article class="container prose">
    {%- if page.glance %}
    <aside class="glance" aria-label="At a glance">
      <p class="glance-title">At a glance</p>
      <dl>
        {%- for g in page.glance %}
        <dt>{{ g.label }}</dt>
        <dd>{{ g.text }}</dd>
        {%- endfor %}
      </dl>
    </aside>
    {%- endif %}
    {{ content }}
  </article>
</main>
